name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print

          PROJECT_DIR=""
          for file in settings.gradle settings.gradle.kts KD.JS/settings.gradle KD.JS/settings.gradle.kts app/settings.gradle app/settings.gradle.kts; do
            if [ -f "$file" ]; then
              PROJECT_DIR="$(dirname "$file")"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.5
        run: |
          wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build App
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
